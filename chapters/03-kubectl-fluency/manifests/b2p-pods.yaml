# Part b2p: a Pod to modify and a Pod to delete
# Seed Pods for the Chapter 03 lab. Created by lab/setup.sh.
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  containers:
    - name: web
      image: nginx:1.26
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: junk
  labels:
    app: junk
spec:
  containers:
    - name: junk
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 100m, memory: 64Mi}
