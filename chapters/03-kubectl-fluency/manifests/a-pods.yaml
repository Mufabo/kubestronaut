# Part a: shared seeded Pods (Pods only, no controllers)
# Seed Pods for the Chapter 03 lab. Created by lab/setup.sh.
apiVersion: v1
kind: Pod
metadata:
  name: web-prod-1
  labels:
    env: prod
    tier: web
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
