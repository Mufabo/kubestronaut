- id: ch22-q01
  type: mcq
  exams: [CKA]
  question: "What problem does the Container Storage Interface (CSI) solve for Kubernetes?"
  choices:
    - "It replaces PersistentVolumes with a faster storage object"
    - "It lets storage vendors ship drivers that plug into Kubernetes without changes to Kubernetes itself"
    - "It encrypts every volume automatically"
    - "It makes every access mode available on every backend"
  answer: B
  explanation: "Before CSI, storage backends were built into Kubernetes. CSI is a standard interface, so a vendor ships its own driver, and Kubernetes calls the driver to create, attach, mount and delete volumes. CSI does not change access mode support or add encryption; those depend on the driver."

- id: ch22-q02
  type: mcq
  exams: [CKA]
  question: "Which part of a CSI driver creates and deletes volumes and attaches them to nodes?"
  choices:
    - "The node part, a DaemonSet"
    - "The controller part, usually a Deployment"
    - "The kubelet, through its CRI"
    - "CoreDNS, which resolves the volume name"
  answer: B
  explanation: "The controller part handles CreateVolume, DeleteVolume and attach requests, usually as a Deployment. The node part, a DaemonSet, mounts an attached volume into a Pod on its node."

- id: ch22-q03
  type: mcq
  exams: [CKA]
  question: "Which object registers a CSI driver with the cluster, describing whether it supports expansion and attachment?"
  choices:
    - "A StorageClass"
    - "A CSIDriver object"
    - "A CSINode object"
    - "A VolumeSnapshot"
  answer: B
  explanation: "A CSIDriver object describes one driver and what it supports. A CSINode object lists the drivers on one node. A StorageClass names a provisioner, and a VolumeSnapshot is a point-in-time copy of a volume."

- id: ch22-q04
  type: mcq
  exams: [CKA]
  question: "A claim uses a StorageClass with `volumeBindingMode: WaitForFirstConsumer`, and it is Pending. No Pod uses it. What is the cause?"
  choices:
    - "The provisioner is broken"
    - "The claim is waiting for a Pod, so the volume is created on the node where that Pod runs"
    - "The access mode is not supported"
    - "The claim requested too much storage"
  answer: B
  explanation: "`WaitForFirstConsumer` delays volume creation until a Pod that uses the claim is scheduled, so the volume can be placed on that Pod's node. The claim is working as designed. With `Immediate`, the volume is created as soon as the claim exists."

- id: ch22-q05
  type: mcq
  exams: [CKA]
  question: "A claim asks for `ReadWriteMany`, and its backend supports only `ReadWriteOnce`. What do you see?"
  choices:
    - "The claim binds, and the access mode is quietly downgraded"
    - "The claim stays Pending, and the events show a ProvisioningFailed warning that names the supported access modes"
    - "The API server rejects the claim when it is created"
    - "The claim binds to any available volume, whatever its access mode"
  answer: B
  explanation: "The API server accepts the claim, because it is a valid object. The provisioner refuses to create a volume for an access mode the backend cannot provide, and the claim stays Pending. The event message says which modes the backend supports."

- id: ch22-q06
  type: mcq
  exams: [CKA]
  question: "Which conditions must hold before a bound claim can grow from 1Gi to 2Gi?"
  choices:
    - "The StorageClass has `allowVolumeExpansion: true`, and the driver supports expansion"
    - "The claim must be deleted and recreated with the larger size"
    - "The volume's reclaim policy must be Retain"
    - "Only the node must be restarted"
  answer: A
  explanation: "Growing a claim needs the class to allow it (`allowVolumeExpansion: true`), and the driver to support it. Deleting the claim would delete the data under the default policy. Expansion is one-way, so a volume cannot shrink."

- id: ch22-q07
  type: mcq
  exams: [CKA]
  question: "A claim with no explicit reclaim setting is served by a StorageClass whose `reclaimPolicy` is `Retain`. What reclaim policy does the PV it creates have?"
  choices:
    - "Delete, the default for every volume"
    - "Retain, copied from the StorageClass that created it"
    - "Recycle, because Retain is an alias for it"
    - "Whatever the claim's annotations say"
  answer: B
  explanation: "A dynamically provisioned volume copies its reclaim policy from the StorageClass that created it. Changing the class later does not change volumes that already exist, so read the policy from the PV."

- id: ch22-q08
  type: task
  exams: [CKA]
  prompt: "Create a StorageClass named `ssd-retain` with the provisioner `rancher.io/local-path`, reclaim policy `Retain`, volume binding mode `WaitForFirstConsumer`, and expansion allowed. Show its reclaim policy and whether expansion is allowed."
  solution: |
    ```bash
    cat <<'YAML' | kubectl apply -f -
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: ssd-retain
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    YAML
    kubectl get storageclass ssd-retain -o jsonpath='{.reclaimPolicy} {.allowVolumeExpansion}{"\n"}'
    ```

    StorageClasses are cluster-scoped, so there is no namespace. Expansion is a field of the
    class, and it must be `true` for any claim from this class to grow.

- id: ch22-q09
  type: task
  exams: [CKA]
  prompt: "In namespace `prod`, create a PersistentVolumeClaim named `logs` requesting `1Gi` with access mode `ReadWriteOnce` and the default storage class, and a Pod `logger` (busybox:1.36, command `sleep 3600`) that mounts it at `/var/log/app`. Once the claim is Bound, write the name of its PersistentVolume into `/tmp/ch22-q09-pv.txt`."
  solution: |
    ```bash
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: logs
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: logger
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: logs
    YAML
    kubectl -n prod wait --for=jsonpath='{.status.phase}'=Bound pvc/logs --timeout=120s
    kubectl -n prod get pvc logs -o jsonpath='{.spec.volumeName}{"\n"}' > /tmp/ch22-q09-pv.txt
    ```

    The claim binds once the Pod is scheduled, because the default class waits for a consumer.

- id: ch22-q10
  type: task
  exams: [CKA]
  prompt: "In namespace `prod`, the claim `media` requests `ReadWriteMany` from the default storage class, and it is stuck in `Pending`. Change it so that it binds, keeping `2Gi`. Use a Pod `player` (busybox:1.36, command `sleep 3600`) that mounts it at `/media`. Show the claim's phase."
  solution: |
    ```bash
    kubectl -n prod delete pvc media --wait=true
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: media
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: player
    spec:
      containers:
        - name: player
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
    YAML
    kubectl -n prod wait --for=jsonpath='{.status.phase}'=Bound pvc/media --timeout=120s
    kubectl -n prod get pvc media -o jsonpath='{.status.phase}{"\n"}'
    ```

    The access mode of a claim cannot be changed in place, so the claim is recreated.
    The default backend supports only `ReadWriteOnce`, so that mode binds.

- id: ch22-q11
  type: task
  exams: [CKA]
  prompt: "Write the value of `allowVolumeExpansion` for the default StorageClass into `/tmp/ch22-q11.txt`. The value is `true` or `false`, and nothing else."
  solution: |
    ```bash
    kubectl get storageclass -o go-template='{{range .items}}{{if eq (index .metadata.annotations "storageclass.kubernetes.io/is-default-class") "true"}}{{if .allowVolumeExpansion}}true{{else}}false{{end}}{{end}}{{end}}{{"\n"}}' > /tmp/ch22-q11.txt
    cat /tmp/ch22-q11.txt
    ```

    The default class is the one annotated `storageclass.kubernetes.io/is-default-class: "true"`.
    In this cluster the field is not set, so the answer is `false`.
