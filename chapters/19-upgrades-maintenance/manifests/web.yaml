apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
# Not managed by any controller: draining its node needs --force, and it is gone afterwards.
apiVersion: v1
kind: Pod
metadata:
  name: debug
  labels:
    app: debug
spec:
  nodeName: node1
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "infinity"]
