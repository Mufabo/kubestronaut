- id: ch46-q01
  type: mcq
  exams: [CKNE]
  question: "A packet arrives at a Linux router and is forwarded to another network. Which netfilter hooks does it pass, in order?"
  choices:
    - "INPUT, OUTPUT"
    - "PREROUTING, FORWARD, POSTROUTING"
    - "PREROUTING, INPUT, FORWARD"
    - "OUTPUT, POSTROUTING"
  answer: B
  explanation: "Forwarded packets never touch INPUT or OUTPUT, which are for packets to and from the host itself. They pass PREROUTING, the routing decision, FORWARD, and POSTROUTING."

- id: ch46-q02
  type: mcq
  exams: [CKNE]
  question: "Which iptables table and chain do you use to block incoming SSH connections to the host itself?"
  choices:
    - "nat table, PREROUTING chain"
    - "filter table, INPUT chain"
    - "filter table, FORWARD chain"
    - "mangle table, OUTPUT chain"
  answer: B
  explanation: "The filter table is for allowing and blocking; INPUT holds rules for packets addressed to this host. FORWARD is for packets passing through."

- id: ch46-q03
  type: mcq
  exams: [CKNE]
  question: "The INPUT chain has rule 1 `-p tcp --dport 22 -j DROP` and rule 2 `-s 10.10.1.10 -j ACCEPT`. Can 10.10.1.10 connect to port 22?"
  choices:
    - "Yes, because rule 2 is more specific"
    - "No, because rule 1 matches first and its DROP decides"
    - "Yes, because ACCEPT always wins"
    - "It depends on the chain's policy"
  answer: B
  explanation: "Rules are evaluated in order, and the first matching rule with a deciding target wins. Insert the ACCEPT above the DROP (iptables -I INPUT 1 ...) to allow that host."

- id: ch46-q04
  type: mcq
  exams: [CKNE]
  question: "`iptables -L -n -v` shows empty chains with policy ACCEPT, yet ping to the host is dropped. What should you check next?"
  choices:
    - "The routing table only"
    - "`nft list ruleset`, because nftables tables of their own also hook into netfilter and iptables does not show them"
    - "The MTU"
    - "Nothing; iptables is always the complete picture"
  answer: B
  explanation: "iptables-nft only shows its own tables. Any nftables table created with nft runs on the same hooks, and a drop there is final."

- id: ch46-q05
  type: mcq
  exams: [CKNE]
  question: "Why must a rule that DNATs traffic for a virtual IP be in PREROUTING?"
  choices:
    - "Because only PREROUTING can see TCP ports"
    - "Because the destination must be rewritten before the routing decision, so the packet is routed to the backend"
    - "Because POSTROUTING is only for IPv6"
    - "Because FORWARD drops DNAT packets"
  answer: B
  explanation: "Routing uses the destination address. Rewriting it in PREROUTING means routing sends the packet to the backend; later chains are too late."

- id: ch46-q06
  type: mcq
  exams: [CKNE]
  question: "kube-proxy's iptables mode creates chains named `KUBE-SVC-...` and `KUBE-SEP-...`. What are they?"
  choices:
    - "KUBE-SVC: one chain per Service that picks an endpoint; KUBE-SEP: one chain per endpoint that DNATs to its Pod address"
    - "KUBE-SVC: firewall rules; KUBE-SEP: logging"
    - "KUBE-SVC: SNAT for Services; KUBE-SEP: DNS rules"
    - "Both hold NetworkPolicy rules"
  answer: A
  explanation: "KUBE-SERVICES matches the ClusterIP and port and jumps to the Service's KUBE-SVC chain, which picks a KUBE-SEP chain at random (-m statistic). Each KUBE-SEP chain DNATs to one Pod's address and port."

- id: ch46-q07
  type: mcq
  exams: [CKNE]
  question: "A Service has three endpoints. kube-proxy's chain has three rules with random matching. What probabilities make the split even?"
  choices:
    - "0.33, 0.33, 0.33"
    - "0.33, 0.5, and then the last rule unconditionally"
    - "0.5, 0.5, 0.5"
    - "1, 1, 1"
  answer: B
  explanation: "The first rule takes 1/3 of new connections. Of the remaining 2/3, the second takes half (1/3 of the total). The last rule takes everything that is left (1/3)."

- id: ch46-q08
  type: mcq
  exams: [CKNE]
  question: "What does conntrack's `ESTABLISHED` state allow a firewall to do?"
  choices:
    - "Block all replies"
    - "Allow reply packets of connections it already allowed, with one rule, instead of writing rules for every reply"
    - "Encrypt established connections"
    - "Load-balance connections"
  answer: B
  explanation: "A stateful firewall accepts ESTABLISHED,RELATED packets first, then decides about NEW connections. Replies need no rules of their own."

- id: ch46-q09
  type: mcq
  exams: [CKNE]
  question: "You changed a DNAT rule to point a virtual IP at a new backend, but an existing long-lived connection still reaches the old one. Why?"
  choices:
    - "iptables changes need a reboot"
    - "conntrack keeps translating existing connections the way it decided on their first packet; only new connections see the new rule"
    - "The new rule was added to the wrong table"
    - "DNAT only works for UDP"
  answer: B
  explanation: "Only the first packet of a connection goes through the nat table. conntrack applies the stored translation to the rest. conntrack -D can delete entries to force new decisions."

- id: ch46-q10
  type: mcq
  exams: [CKNE]
  question: "A conntrack entry reads `src=10.10.1.10 dst=10.96.0.10 sport=38168 dport=80 src=10.10.2.11 dst=10.10.1.10 sport=80 dport=38168`. What happened to this connection?"
  choices:
    - "It was SNATed to 10.10.2.11"
    - "It was sent to the virtual IP 10.96.0.10 and DNATed to the backend 10.10.2.11"
    - "It failed"
    - "Two separate connections were made"
  answer: B
  explanation: "The first half is the original direction (to 10.96.0.10), the second the expected reply (from 10.10.2.11). The changed address between the halves is the DNAT."

- id: ch46-q11
  type: mcq
  exams: [CKNE]
  question: "On a current Debian or Ubuntu system, `iptables -V` prints `iptables v1.8.11 (nf_tables)`. What does that mean?"
  choices:
    - "iptables is not installed"
    - "The iptables command stores its rules as nftables tables (iptables-nft); nft list ruleset shows them too"
    - "Only IPv6 is supported"
    - "The kernel has no netfilter"
  answer: B
  explanation: "iptables-nft translates the classic syntax into nftables rules in tables such as ip filter and ip nat. iptables-legacy writes to the old kernel tables instead."

- id: ch46-q12
  type: mcq
  exams: [CKNE]
  question: "Which three proxy modes does kube-proxy support on Linux?"
  choices:
    - "userspace, eBPF, and XDP"
    - "iptables, ipvs, and nftables"
    - "Envoy, HAProxy, and NGINX"
    - "VXLAN, Geneve, and IPIP"
  answer: B
  explanation: "kube-proxy programs iptables rules, IPVS virtual servers, or nftables rules. eBPF replacements such as Cilium's work without kube-proxy (Chapter 54); VXLAN and Geneve are overlays, not proxy modes."
