- id: ch51-q01
  type: mcq
  exams: [CKNE]
  question: "How does a Pod get a second network interface in a cluster with Multus?"
  choices:
    - "With a `networks:` list in the Pod spec"
    - "With the annotation `k8s.v1.cni.cncf.io/networks`, naming NetworkAttachmentDefinitions"
    - "With a second container that has `hostNetwork: true`"
    - "With a Service of type `ExternalName`"
  answer: B
  explanation: "Kubernetes has no field for extra networks. Multus reads the annotation and calls the delegate plugin of each named NetworkAttachmentDefinition after the cluster network."

- id: ch51-q02
  type: mcq
  exams: [CKNE]
  question: "What does Multus call first for every Pod?"
  choices:
    - "The secondary networks, in alphabetical order"
    - "The cluster network: the plugin that would have run without Multus, which creates `eth0`"
    - "kube-proxy"
    - "The `static` IPAM plugin"
  answer: B
  explanation: "The cluster network keeps the Pod a normal Kubernetes Pod. Its configuration path is recorded in Multus's own file as `clusterNetwork`."

- id: ch51-q03
  type: mcq
  exams: [CKNE]
  question: "Why is Multus's configuration file named `00-multus.conf`?"
  choices:
    - "The Multus binary only reads files that start with 00"
    - "The runtime uses the first configuration in name order, so Multus must sort before the cluster network's file"
    - "Kubernetes requires a numeric prefix on every CNI file"
    - "It is a backup that is never read"
  answer: B
  explanation: "Only one configuration is used per Pod: the first `.conf`, `.conflist`, or `.json` file. Multus has to be that file, and then it calls the others."

- id: ch51-q04
  type: mcq
  exams: [CKNE]
  question: "After Multus is installed on a Cilium cluster, Pods with the networks annotation start normally but have only `eth0`, and no `network-status` annotation. What is the most likely cause?"
  choices:
    - "The NetworkAttachmentDefinition has a JSON error"
    - "Cilium's `cni-exclusive` mode renamed Multus's configuration, so the runtime calls Cilium directly"
    - "The macvlan binary is missing"
    - "The Pods need a restart policy of `Always`"
  answer: B
  explanation: "A JSON error or a missing binary makes the Pod fail with an error. A missing `network-status` annotation means Multus never ran; on Cilium, check for `00-multus.conf.cilium_bak` in `/etc/cni/net.d`."

- id: ch51-q05
  type: mcq
  exams: [CKNE]
  question: "What does a NetworkAttachmentDefinition's `spec.config` contain?"
  choices:
    - "A list of Pod names allowed to attach"
    - "A complete CNI configuration as a JSON string, like a file in `/etc/cni/net.d`"
    - "A Kubernetes NetworkPolicy"
    - "The Service CIDR for the secondary network"
  answer: B
  explanation: "Multus passes this configuration to the plugin it names in `type`, with the IPAM section inside it."

- id: ch51-q06
  type: mcq
  exams: [CKNE]
  question: "Two Pods on different nodes attach to the same macvlan NAD with `host-local` IPAM and both get `172.18.100.10`. Why?"
  choices:
    - "macvlan copies the node's address into every Pod"
    - "host-local keeps its leases in a directory on each node, so the nodes do not know about each other's addresses"
    - "The NAD's range has only one address"
    - "Multus reuses addresses on purpose"
  answer: B
  explanation: "host-local is node-local. On a network that spans nodes, use static IPAM, a different range per node, or a cluster-wide IPAM plugin such as whereabouts."

- id: ch51-q07
  type: mcq
  exams: [CKNE]
  question: "Which plugin gives each Pod interface its own MAC address on the node's physical network?"
  choices:
    - "ipvlan"
    - "macvlan"
    - "loopback"
    - "portmap"
  answer: B
  explanation: "macvlan children each have their own MAC; ipvlan children share the parent's MAC, which suits networks that allow only one MAC per port."

- id: ch51-q08
  type: mcq
  exams: [CKNE]
  question: "You add the networks annotation to a running Pod with `kubectl annotate`. What happens?"
  choices:
    - "Multus adds `net1` within a few seconds"
    - "Nothing: networks are attached only when the Pod's sandbox is created"
    - "The Pod restarts automatically"
    - "The API server rejects the change"
  answer: B
  explanation: "Recreate the Pod (or change a Deployment's Pod template) to get the new interfaces."

- id: ch51-q09
  type: mcq
  exams: [CKNE]
  question: "Which of these applies to a Pod's secondary interface `net1`?"
  choices:
    - "Kubernetes NetworkPolicy filters it like eth0"
    - "A Service can select it with `targetPort: net1`"
    - "None of the cluster network's features: it is not listed in the Pod's status, and neither Services nor NetworkPolicy use it"
    - "kube-proxy load-balances across it"
  answer: C
  explanation: "Secondary networks are outside Kubernetes' model. Their traffic is not filtered or load-balanced by the cluster's components."

- id: ch51-q10
  type: task
  exams: [CKNE]
  prompt: "In namespace `net`, create a NetworkAttachmentDefinition `data` that attaches Pods to the node interface `ens4` with ipvlan in L2 mode and addresses from `192.168.60.0/24` handed out by host-local, for Pods that all run on one node."
  solution: |
    ```bash
    kubectl -n net apply -f - <<'EOF'
    apiVersion: k8s.cni.cncf.io/v1
    kind: NetworkAttachmentDefinition
    metadata:
      name: data
    spec:
      config: |
        {
          "cniVersion": "1.0.0",
          "type": "ipvlan",
          "master": "ens4",
          "mode": "l2",
          "ipam": {"type": "host-local", "subnet": "192.168.60.0/24"}
        }
    EOF
    ```

    host-local is fine here because all the Pods are on one node. Check that `ipvlan` is in `/opt/cni/bin` on that node.

- id: ch51-q11
  type: task
  exams: [CKNE]
  prompt: "Run Pod `probe` in namespace `net` with two secondary interfaces: `data` as `data0` and `storage` (in namespace `infra`) as `stor0`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: probe
      namespace: net
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "data", "interface": "data0"}, {"name": "storage", "namespace": "infra", "interface": "stor0"}]'
    spec:
      containers:
        - name: probe
          image: nicolaka/netshoot:v0.14
          command: ["sleep", "infinity"]
    ```

    Then `kubectl -n net exec probe -- ip -br addr` shows `eth0`, `data0`, and `stor0`, and the `network-status` annotation lists all three.

- id: ch51-q12
  type: task
  exams: [CKNE]
  prompt: "On a Cilium cluster, Multus was installed but no Pod gets its secondary interfaces. Fix it so that Multus stays in charge after future Cilium restarts."
  solution: |
    ```bash
    ssh node1 ls /etc/cni/net.d     # 00-multus.conf.cilium_bak: Cilium moved it aside
    helm upgrade cilium cilium --repo https://helm.cilium.io --version 1.20.5 \
      -n kube-system --reuse-values --set cni.exclusive=false
    kubectl -n kube-system rollout restart daemonset/cilium
    kubectl -n kube-system rollout restart daemonset/kube-multus-ds
    ssh node1 ls /etc/cni/net.d     # 00-multus.conf is back, first in order
    ```

    Then recreate the Pods that need secondary interfaces.
