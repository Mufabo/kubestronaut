- id: ch13-q01
  type: mcq
  exams: [KCNA, CKAD]
  question: "A container writes a file to its own root filesystem, and then the Pod is deleted and recreated. What happens to the file?"
  choices:
    - "It survives, because the container's filesystem is stored in etcd"
    - "It is lost, because the container's filesystem is discarded with the container"
    - "It survives, if the new Pod runs on the same node"
    - "It survives, because the kubelet copies root filesystems to a backup volume"
  answer: B
  explanation: "A container's root filesystem comes from its image and is discarded with the container. Data that must survive belongs in a volume: an emptyDir lasts as long as the Pod, and a PersistentVolumeClaim outlives Pods altogether."

- id: ch13-q02
  type: mcq
  exams: [KCNA, CKAD, CKA]
  question: "What is the difference between a PersistentVolume and a PersistentVolumeClaim?"
  choices:
    - "A PV is namespace-scoped and a PVC is cluster-scoped"
    - "A PV is a piece of storage in the cluster, and a PVC is a request for storage from a namespace"
    - "A PVC is created by the kubelet, and a PV is created by the user"
    - "They are two names for the same object"
  answer: B
  explanation: "A PersistentVolume is cluster-scoped storage. A PersistentVolumeClaim is namespace-scoped and asks for a size, access modes and a class. A Pod refers to the claim, and the claim binds to a volume."

- id: ch13-q03
  type: mcq
  exams: [CKAD, CKA]
  question: "A claim asks for `ReadWriteOnce`. Which description of that access mode is correct?"
  choices:
    - "Exactly one Pod in the cluster may mount the volume"
    - "The volume may be mounted read-write by a single node; several Pods on that node may share it"
    - "The volume may be mounted read-only by many nodes"
    - "The volume may be mounted read-write by many nodes at once"
  answer: B
  explanation: "`ReadWriteOnce` limits the volume to one node, not one Pod. Several Pods on that node may mount it. When exactly one Pod must have write access cluster-wide, use `ReadWriteOncePod`."

- id: ch13-q04
  type: mcq
  exams: [CKAD, CKA]
  question: "A PersistentVolumeClaim has been `Pending` for minutes. Its StorageClass uses `volumeBindingMode: WaitForFirstConsumer`, and no Pod uses it yet. What is the correct next step?"
  choices:
    - "Delete the StorageClass and create one with `Immediate` binding"
    - "Create the Pod that uses the claim, which lets the claim bind on the Pod's node"
    - "Restart the kubelet on every node"
    - "Edit the claim's status to `Bound`"
  answer: B
  explanation: "`WaitForFirstConsumer` binds the claim only once a Pod that uses it is scheduled, so that the volume is created on the Pod's node. The claim is working as designed. Create the consumer Pod, and the claim binds."

- id: ch13-q05
  type: mcq
  exams: [CKAD, CKA]
  question: "You delete a PVC whose PV has the reclaim policy `Retain`. What state does the PV enter, and can a new claim use it immediately?"
  choices:
    - "It is deleted along with the claim"
    - "It becomes `Released`; it is not bound, and a new claim cannot use it until an administrator clears its claim reference"
    - "It becomes `Available` and is bound to the next claim that asks for its class"
    - "It is copied to a new PV with the reclaim policy `Delete`"
  answer: B
  explanation: "`Retain` keeps the volume and its data after the claim is gone. The volume is `Released`, and it will not be reused automatically, because its data may still matter. An administrator decides whether to keep the data (clearing the claim reference) or to delete the PV."

- id: ch13-q06
  type: mcq
  exams: [CKA]
  question: "Which StorageClass field decides whether a PV is created when a claim is made, or only when a Pod that uses the claim is scheduled?"
  choices:
    - "`reclaimPolicy`"
    - "`provisioner`"
    - "`volumeBindingMode`"
    - "`allowVolumeExpansion`"
  answer: C
  explanation: "`volumeBindingMode` is `Immediate` or `WaitForFirstConsumer`. `reclaimPolicy` decides what happens to the volume after its claim is deleted, `provisioner` names the driver that creates volumes, and `allowVolumeExpansion` permits claims to grow."

- id: ch13-q07
  type: mcq
  exams: [CKAD]
  question: "A Pod's `emptyDir` volume has `sizeLimit: 10Mi`, and the process writes 20Mi into it. What happens?"
  choices:
    - "The write fails at 10Mi, and the process continues without error"
    - "The Pod is evicted by the kubelet, because the volume exceeded its size limit"
    - "The volume is automatically expanded to 20Mi"
    - "The container is killed with the reason `OOMKilled`"
  answer: B
  explanation: "An emptyDir's `sizeLimit` is enforced by the kubelet, which evicts the Pod when the volume exceeds it. `OOMKilled` is a memory-limit event, which is a different mechanism from storage limits."

- id: ch13-q08
  type: task
  exams: [CKAD, CKA]
  prompt: "In namespace `prod`, create a PersistentVolumeClaim named `logs` requesting `200Mi` with access mode `ReadWriteOnce`, using the default storage class. Then create a Pod named `logger` running `busybox:1.36` with the command `sleep 3600` that mounts `logs` at `/var/log/app`. Show the claim's status once the Pod is Running."
  solution: |
    ```bash
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: logs
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 200Mi
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: logger
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: logs
    YAML
    kubectl -n prod wait --for=condition=Ready pod/logger --timeout=120s
    kubectl -n prod get pvc logs -o jsonpath='{.status.phase}{"\n"}'
    ```

    The claim stays `Pending` until the Pod is scheduled, because the default class
    waits for a consumer. Once the Pod runs, the claim is `Bound`.

- id: ch13-q09
  type: task
  exams: [CKAD, CKA]
  prompt: "In namespace `prod`, create a Pod named `cache` running `busybox:1.36` with the command `sleep 3600`. It mounts an `emptyDir` named `scratch` at `/tmp/cache`, with a size limit of `64Mi`. Show the size limit of the volume."
  solution: |
    ```bash
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: cache
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp/cache
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
    YAML
    kubectl -n prod get pod cache -o jsonpath='{.spec.volumes[0].emptyDir.sizeLimit}{"\n"}'
    ```

    The size limit is a field of the `emptyDir` volume, so it sits under `volumes`, not under the container.

- id: ch13-q10
  type: task
  exams: [CKA]
  prompt: "Create a StorageClass named `fast-local` with the provisioner `rancher.io/local-path`, reclaim policy `Retain`, and volume binding mode `WaitForFirstConsumer`. Show its reclaim policy and binding mode."
  solution: |
    ```bash
    cat <<'YAML' | kubectl apply -f -
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: fast-local
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    YAML
    kubectl get storageclass fast-local -o jsonpath='{.reclaimPolicy}{" "}{.volumeBindingMode}{"\n"}'
    ```

    StorageClasses are cluster-scoped, so there is no `-n` flag. Delete the class afterwards if you want to keep the cluster tidy.

- id: ch13-q11
  type: task
  exams: [CKAD, CKA]
  prompt: "In namespace `prod`, a PersistentVolumeClaim named `reports` is stuck in `Pending`, because it asks for storage class `slow-disk`, which does not exist. Change the claim so that it uses the default storage class instead. The claim is not yet bound to any volume, so you may delete and recreate it. Show its storage class."
  solution: |
    ```bash
    kubectl -n prod delete pvc reports
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: reports
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 100Mi
    YAML
    kubectl -n prod get pvc reports -o jsonpath='{.spec.storageClassName}{"\n"}'
    ```

    A claim's `storageClassName` cannot be changed in place, so it must be recreated.
    Leaving the field out is enough: the API server fills in the cluster's default
    class, so the output is `standard` here. Read the field, not the claim's status.

- id: ch13-q12
  type: mcq
  exams: [CKAD, CKA]
  question: "A StatefulSet `cache` with a volume claim template `data` is scaled from 3 replicas to 1. What happens to the claims?"
  choices:
    - "`data-cache-1` and `data-cache-2` are deleted with their Pods"
    - "All three claims stay; scaling back up reattaches `data-cache-1` and `data-cache-2` to Pods with the same names"
    - "The claims are merged into `data-cache-0`"
    - "The claims stay, but new Pods get new, empty claims when scaled up again"
  answer: B
  explanation: "A StatefulSet removes the highest ordinals first and keeps their claims. A Pod that comes back as `cache-1` mounts `data-cache-1` again, with its data. Deleting the claims is a separate, deliberate step."

- id: ch13-q13
  type: task
  exams: [CKAD]
  prompt: "In namespace `prod`, create a headless Service `kv` (selector `app=kv`, port 6379) and a StatefulSet `kv` with 3 replicas of `redis:7.4`, each with its own `1Gi` `ReadWriteOnce` claim mounted at `/data`. Show the Pods and claims."
  solution: |
    ```bash
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: v1
    kind: Service
    metadata:
      name: kv
    spec:
      clusterIP: None
      selector:
        app: kv
      ports:
        - port: 6379
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: kv
    spec:
      serviceName: kv
      replicas: 3
      selector:
        matchLabels:
          app: kv
      template:
        metadata:
          labels:
            app: kv
        spec:
          containers:
            - name: redis
              image: redis:7.4
              volumeMounts:
                - name: data
                  mountPath: /data
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
    YAML
    kubectl -n prod get pods,pvc -l app=kv
    ```

    The Pods are `kv-0` to `kv-2`, created in order, and the claims `data-kv-0` to `data-kv-2`. Each Pod is also reachable as `kv-0.kv.prod.svc.cluster.local`, through the headless Service.
