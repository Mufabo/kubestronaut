- id: ch08-q01
  type: mcq
  exams: [CKAD]
  question: "You write a Job whose Pod template has `restartPolicy: Always`. What happens?"
  choices:
    - "The Job runs the Pods until they fail, then retries forever"
    - "The API server rejects the Job, because a Job's Pods must end; the allowed values are Never and OnFailure"
    - "The Job works as normal, because Always is the default for every Pod"
    - "The Pods are restarted in place, and the Job completes when the first one exits"
  answer: B
  explanation: "A Job's Pods are meant to finish. `Always` would restart a successful container forever, so the API server refuses it. Only `Never` and `OnFailure` are valid in a Job's Pod template."

- id: ch08-q02
  type: mcq
  exams: [CKAD]
  question: "A Job has `completions: 5` and `parallelism: 3`. What is the most Pods that run at the same time?"
  choices:
    - "Five, one for each completion"
    - "Three, the value of parallelism"
    - "Eight, the sum of completions and parallelism"
    - "One, because Jobs always run their Pods in sequence"
  answer: B
  explanation: "`parallelism` caps how many Pods run at once. `completions` says how many must succeed in total. With these values the Job starts three Pods, and starts a new one each time one succeeds, until five have succeeded."

- id: ch08-q03
  type: mcq
  exams: [CKAD]
  question: "A Job has `backoffLimit: 4` and `restartPolicy: Never`, and every Pod fails. How many failed Pods does it create before it is marked as failed?"
  choices:
    - "Four"
    - "Five"
    - "Six, the default"
    - "Infinitely many, because the backoff delay grows"
  answer: B
  explanation: "`backoffLimit` is the number of retries, so the Job tolerates four retries and gives up after the fifth failure. The Job's `Failed` condition then has the reason `BackoffLimitExceeded`. Counting from zero is the usual mistake here: the limit is retries, not attempts."

- id: ch08-q04
  type: mcq
  exams: [CKAD]
  question: "A CronJob with `concurrencyPolicy: Forbid` is due to start a new run, but the previous run is still active. What happens?"
  choices:
    - "The new run starts, and both run side by side"
    - "The running Job is cancelled and replaced by the new one"
    - "The new run is skipped; the previous run continues"
    - "The new run is queued and starts when the previous one finishes"
  answer: C
  explanation: "`Forbid` skips the new run while one is active. `Allow` (the default) runs both, and `Replace` cancels the active one and starts the new one. Queuing is not a policy Kubernetes offers."

- id: ch08-q05
  type: mcq
  exams: [CKAD]
  question: "What does `startingDeadlineSeconds` on a CronJob control?"
  choices:
    - "How long a single Job may run before it is killed"
    - "How late a scheduled run may start after its scheduled time before it is skipped"
    - "How many seconds to wait between retries of a failed Job"
    - "How long finished Jobs are kept before they are deleted"
  answer: B
  explanation: "If the controller misses a scheduled time, for example because the cluster was down, a run that is still within `startingDeadlineSeconds` starts late; a run past that window is skipped. Job runtime is `activeDeadlineSeconds`, retries are `backoffLimit`, and cleanup of finished Jobs is `ttlSecondsAfterFinished` or the history limits."

- id: ch08-q06
  type: mcq
  exams: [CKAD]
  question: "A Job should be killed if it runs for more than 600 seconds, whatever state its Pods are in. Which field sets that?"
  choices:
    - "`spec.backoffLimit: 600`"
    - "`spec.activeDeadlineSeconds: 600`"
    - "`spec.ttlSecondsAfterFinished: 600`"
    - "`spec.template.spec.terminationGracePeriodSeconds: 600`"
  answer: B
  explanation: "`activeDeadlineSeconds` is a time limit for the whole Job, counted from its start. When it runs out, the Job fails with the reason `DeadlineExceeded`. `ttlSecondsAfterFinished` deletes a Job after it finishes, and `terminationGracePeriodSeconds` is how long one container gets to stop."

- id: ch08-q07
  type: mcq
  exams: [CKAD]
  question: "You want finished Jobs to be deleted automatically, 100 seconds after they finish. Which field does that?"
  choices:
    - "`spec.activeDeadlineSeconds: 100`"
    - "`spec.ttlSecondsAfterFinished: 100`"
    - "`spec.successfulJobsHistoryLimit: 100`"
    - "`spec.backoffLimit: 100`"
  answer: B
  explanation: "`ttlSecondsAfterFinished` makes the TTL controller delete the Job, and its Pods, that many seconds after it completes or fails. `successfulJobsHistoryLimit` is a CronJob field that keeps a count of finished Jobs rather than a time."

- id: ch08-q08
  type: task
  exams: [CKAD]
  prompt: "In namespace `prod`, create a Job named `ping` that runs the image `busybox:1.36` with the command `sh -c 'echo ping'`. It must complete three times, one Pod at a time. Wait until it completes, then show the number of completions."
  solution: |
    ```bash
    cat <<'YAML' | kubectl -n prod apply -f -
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ping
    spec:
      completions: 3
      parallelism: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ping
              image: busybox:1.36
              command: ["sh", "-c", "echo ping"]
    YAML
    kubectl -n prod wait --for=condition=Complete job/ping --timeout=180s
    kubectl -n prod get job ping
    ```

    The imperative `kubectl create job` cannot set `completions`, so write the YAML. `parallelism: 1` is the default; it is set here to make the intent explicit.

- id: ch08-q09
  type: task
  exams: [CKAD]
  prompt: "In namespace `prod`, create a CronJob named `cleanup` that runs `busybox:1.36` with the command `sh -c 'echo cleanup'` every 15 minutes. A new run must never start while the previous one is still running."
  solution: |
    ```bash
    kubectl -n prod create cronjob cleanup --image=busybox:1.36 --schedule="*/15 * * * *" -- sh -c 'echo cleanup'
    kubectl -n prod patch cronjob cleanup -p '{"spec":{"concurrencyPolicy":"Forbid"}}'
    kubectl -n prod get cronjob cleanup
    ```

    `kubectl create cronjob` gives the CronJob the schedule and the template; the patch sets `concurrencyPolicy: Forbid`, which the imperative form has no flag for.

- id: ch08-q10
  type: task
  exams: [CKAD]
  prompt: "In namespace `prod`, the CronJob `cleanup` must stop creating new Jobs, but keep the existing ones. Change it so that it is suspended, then show that the field is set."
  solution: |
    ```bash
    kubectl -n prod patch cronjob cleanup -p '{"spec":{"suspend":true}}'
    kubectl -n prod get cronjob cleanup -o jsonpath='{.spec.suspend}{"\n"}'
    ```

    `suspend: true` stops new runs only. Jobs that were already running are not affected, and deleting the CronJob would remove the schedule, which is not what was asked.

- id: ch08-q11
  type: task
  exams: [CKAD]
  prompt: "In namespace `prod`, start a one-off Job named `cleanup-now` from the CronJob `cleanup`, even though `cleanup` is suspended. Wait until the Job completes, and show its logs."
  solution: |
    ```bash
    kubectl -n prod create job cleanup-now --from=cronjob/cleanup
    kubectl -n prod wait --for=condition=Complete job/cleanup-now --timeout=180s
    kubectl -n prod logs job/cleanup-now
    ```

    `--from` copies the CronJob's template into a new Job, so the suspension does not block it: `suspend` only stops the schedule.
