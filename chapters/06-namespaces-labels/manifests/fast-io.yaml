# Namespace ch06-blue, Task 5: waits for a node labelled ch06.kbook.io/disk=ssd.
apiVersion: v1
kind: Pod
metadata:
  name: fast-io
  labels: {app: fast-io}
spec:
  terminationGracePeriodSeconds: 1   # busybox sleep ignores SIGTERM
  nodeSelector:
    ch06.kbook.io/disk: ssd
  containers:
    - name: io
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
