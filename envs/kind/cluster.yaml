# Tier 1 lab cluster: 1 control plane + 2 workers.
# The node image is injected by `make cluster` from versions.env.
# No default CNI: tools/cluster.sh installs Calico (CALICO_VERSION), which
# enforces NetworkPolicy. Its default pod CIDR is 192.168.0.0/16, so use it here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
