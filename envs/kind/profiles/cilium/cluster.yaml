# Tier 1 lab cluster: 1 control plane + 2 workers, no default CNI.
# tools/cluster.sh adds the node image from versions.env and the cluster name.
# Pod CIDR 10.244.0.0/16 (each node gets a /24 from it), Services 10.96.0.0/16.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
