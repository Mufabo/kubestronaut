# cka2-work: question 6. Each replica asks for more CPU than any node has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big
spec:
  replicas: 2
  selector:
    matchLabels:
      app: big
  template:
    metadata:
      labels:
        app: big
    spec:
      containers:
        - name: big
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "2"
              memory: 64Mi
