# cka2-locked: question 11. Two Pods that can reach each other, until the reader
# locks the Namespace down.
apiVersion: v1
kind: Pod
metadata:
  name: a
  labels:
    app: a
spec:
  containers:
    - name: a
      image: busybox:1.36
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: b
  labels:
    app: b
spec:
  containers:
    - name: b
      image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: b
spec:
  selector:
    app: b
  ports:
    - port: 80
