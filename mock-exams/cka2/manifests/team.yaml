# cka2-team: the group analysts may view this Namespace (question 2), and one Report.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analysts-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: analysts
---
apiVersion: cka2.kbook.io/v1
kind: Report
metadata:
  name: weekly
spec:
  period: 7d
