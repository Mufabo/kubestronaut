# KCSA practice exam: 60 original questions, grouped by curriculum domain.
# The id names the domain (see quiz.yaml); `make quiz EXAM=kcsa` shuffles the
# order for each attempt. Keep the per-domain counts in quiz.yaml in step.

# --- Overview of Cloud Native Security (8) ------------------------------------

- id: kcsa-over-01
  type: mcq
  question: "In the 4Cs model of cloud native security, which layer is the innermost one, whose security depends on every layer around it?"
  choices:
    - "Cloud"
    - "Cluster"
    - "Container"
    - "Code"
  answer: D
  explanation: "The layers nest: Cloud (or data center) contains the Cluster, which runs Containers, which run your Code. Each layer can only be as secure as the layers outside it, so the application code is the innermost layer."

- id: kcsa-over-02
  type: mcq
  question: "Your team uses a managed Kubernetes service from a cloud provider. Who is normally responsible for the RBAC rules that decide what your developers may do in the cluster?"
  choices:
    - "The cloud provider, as part of the managed control plane"
    - "Your team, as the cluster's user"
    - "The CNCF, through the Kubernetes defaults"
    - "Nobody: managed clusters have no RBAC"
  answer: B
  explanation: "In the shared responsibility model the provider runs and patches the control plane, but who may do what inside the cluster (RBAC, NetworkPolicies, workload settings) stays the customer's job."

- id: kcsa-over-03
  type: mcq
  question: "Which isolation technique gives each Pod a kernel of its own?"
  choices:
    - "Kata Containers, which runs each Pod in a lightweight virtual machine"
    - "A separate Namespace per team"
    - "A NetworkPolicy that denies all traffic"
    - "The Pod Security level restricted"
  answer: A
  explanation: "Namespaces, NetworkPolicies, and Pod Security all leave containers on the node's shared kernel. Kata Containers puts each Pod in a small VM with its own guest kernel; gVisor instead intercepts system calls with a user-space kernel."

- id: kcsa-over-04
  type: mcq
  question: "What does referring to an image by digest (name@sha256:...) guarantee that a tag does not?"
  choices:
    - "The image has been scanned for vulnerabilities"
    - "The image was signed by its publisher"
    - "Every pull returns exactly the same content, because the digest is a hash of it"
    - "The image is pulled from a private registry"
  answer: C
  explanation: "A tag is a movable pointer: whoever can push to the repository can point it at different content. A digest is a cryptographic hash of the image manifest, so it always names the same content. It says nothing about scans or signatures by itself."

- id: kcsa-over-05
  type: mcq
  question: "Why do security guides recommend minimal or distroless base images?"
  choices:
    - "They make containers start without a container runtime"
    - "They contain fewer packages, so fewer vulnerabilities, and often no shell or package manager an attacker could use"
    - "They encrypt the application's files"
    - "They are required by Pod Security restricted"
  answer: B
  explanation: "Every package in an image is something to patch and something an attacker can use. A distroless image holds the application and its runtime only. Pod Security does not look at image contents at all."

- id: kcsa-over-06
  type: mcq
  question: "A developer commits a cloud API key to the application's Git repository. Which control is meant to catch this before the image is built and deployed?"
  choices:
    - "A NetworkPolicy"
    - "Encryption at rest for Secrets"
    - "Pod Security baseline"
    - "Secret scanning in the CI pipeline or as a commit hook"
  answer: D
  explanation: "Credentials in code belong to the Code layer and are caught where the code is: by secret scanners in pre-commit hooks and CI. Once leaked, the key must also be revoked; removing the commit does not remove it from history or from copies."

- id: kcsa-over-07
  type: mcq
  question: "On a cloud VM, any Pod can reach the instance metadata endpoint 169.254.169.254 and read the node's cloud credentials. Which control limits this from inside the cluster?"
  choices:
    - "A NetworkPolicy whose egress rules exclude 169.254.169.254/32"
    - "Encrypting Secrets at rest"
    - "Running the Pod with readOnlyRootFilesystem"
    - "Pinning images by digest"
  answer: A
  explanation: "An egress NetworkPolicy (ipBlock with an except for the metadata address) keeps Pods away from the endpoint. Cloud-side settings help too, such as requiring session tokens (IMDSv2) with a hop limit of 1, and giving the node identity only the permissions it needs."

- id: kcsa-over-08
  type: mcq
  question: "What does defense in depth mean for a Kubernetes platform?"
  choices:
    - "Running every workload in its own cluster"
    - "Choosing the single strongest control and relying on it"
    - "Layering independent controls, so that the failure of one does not expose everything"
    - "Encrypting data twice"
  answer: C
  explanation: "No control is perfect. If an RBAC rule is too broad, Pod Security, NetworkPolicies, seccomp, and audit logging still limit and reveal what an attacker can do. Each layer covers some failures of the others."

# --- Kubernetes Cluster Component Security (13) ---------------------------------

- id: kcsa-comp-01
  type: mcq
  question: "Anonymous authentication is enabled on the API server. A request arrives with no credentials. As whom is it treated?"
  choices:
    - "As the user system:anonymous in the group system:unauthenticated"
    - "As cluster-admin, because no user was given"
    - "As the default ServiceAccount of the default Namespace"
    - "It is always rejected before authorization"
  answer: A
  explanation: "Anonymous requests get the user system:anonymous and the group system:unauthenticated, and authorization then decides. Any RBAC binding to these subjects is effectively public; the safe state is to grant them nothing beyond the health and discovery endpoints."

- id: kcsa-comp-02
  type: mcq
  question: "kubeadm starts kube-controller-manager with --use-service-account-credentials=true. What does that achieve?"
  choices:
    - "The controller manager stops needing a kubeconfig"
    - "Each controller uses its own ServiceAccount, so its permissions can be limited to what that controller needs"
    - "ServiceAccount tokens are no longer issued to Pods"
    - "Controllers run as Pods in kube-system"
  answer: B
  explanation: "Without it, every controller acts with the controller manager's own, broad credentials. With it, each controller (deployment-controller, job-controller, ...) has its own identity and RBAC role, which limits what one buggy or abused controller can do."

- id: kcsa-comp-03
  type: mcq
  question: "Why does kubeadm make kube-scheduler and kube-controller-manager listen only on 127.0.0.1?"
  choices:
    - "Because they cannot use TLS"
    - "So that the API server can reach them through a Service"
    - "So that their HTTPS endpoints (health, metrics, profiling) are reachable only from the control plane node itself"
    - "To save memory"
  answer: C
  explanation: "Neither component needs incoming connections from other machines: they talk to the API server, not the other way round. Binding to the loopback address removes them from the network's attack surface. Disabling profiling (--profiling=false) narrows it further."

- id: kcsa-comp-04
  type: mcq
  question: "Which kubelet setting is a security risk on a production node?"
  choices:
    - "authorization.mode: Webhook"
    - "authentication.anonymous.enabled: false"
    - "rotateCertificates: true"
    - "readOnlyPort: 10255"
  answer: D
  explanation: "The read-only port serves Pod and node information over plain HTTP with no authentication. It should be 0 (off). Webhook authorization, anonymous authentication off, and certificate rotation are the hardened settings."

- id: kcsa-comp-05
  type: mcq
  question: "An attacker can reach a kubelet's port 10250, and the kubelet allows anonymous requests with AlwaysAllow authorization. What can the attacker do?"
  choices:
    - "Only read the node's CPU usage"
    - "Nothing, because 10250 is a metrics port"
    - "Change the API server's flags"
    - "List the node's Pods and run commands in their containers"
  answer: D
  explanation: "The kubelet API serves exec, attach, logs, and Pod listings. Open to anonymous users with AlwaysAllow, it hands out command execution in every container on the node. Set anonymous authentication off and authorization mode Webhook, so the API server's RBAC decides."

- id: kcsa-comp-06
  type: mcq
  question: "A Pod mounts the host's /run/containerd/containerd.sock. Why is that dangerous?"
  choices:
    - "It slows down image pulls"
    - "Whoever controls the Pod can create and control any container on the node, including privileged ones"
    - "The socket only allows reading logs"
    - "It breaks the Pod's DNS resolution"
  answer: B
  explanation: "The runtime socket is an administrative interface to the container runtime: through it a process can start containers with host mounts or privileges, outside Kubernetes' admission control. It is equivalent to root on the node."

- id: kcsa-comp-07
  type: mcq
  question: "kube-proxy runs on every node with host networking and elevated privileges. Why does it need them?"
  choices:
    - "To program the node's packet filtering rules (iptables, IPVS, or nftables) that implement Services"
    - "To schedule Pods onto the node"
    - "To store Service definitions in etcd"
    - "To terminate TLS for Ingress objects"
  answer: A
  explanation: "kube-proxy watches Services and EndpointSlices and writes the node's NAT and filter rules. That needs the host's network namespace and NET_ADMIN-level privileges, which also makes a compromised kube-proxy powerful on its node."

- id: kcsa-comp-08
  type: mcq
  question: "What does hostPID: true give a Pod's containers?"
  choices:
    - "A process ID of 1 for the application"
    - "Their own PID namespace with stronger isolation"
    - "A view of every process on the node, and the ability to signal or inspect them as permissions allow"
    - "Access to the host's network interfaces"
  answer: C
  explanation: "hostPID puts the containers in the node's PID namespace. They see all processes, including other containers' and the kubelet's, and can read their environment and /proc entries where permissions allow. Pod Security baseline forbids it."

- id: kcsa-comp-09
  type: mcq
  question: "Who should be able to connect to etcd's client port (2379) in a kubeadm cluster?"
  choices:
    - "Every Pod, so that applications can store configuration"
    - "Every node's kubelet"
    - "Any user with a valid kubeconfig"
    - "Only the API server (and backup tooling), authenticated with client certificates from etcd's own CA"
  answer: D
  explanation: "Whoever can talk to etcd can read and change all cluster state, Secrets included, bypassing authentication, authorization, and admission. kubeadm gives etcd its own CA and requires client certificates; firewalls should keep everyone else away from 2379."

- id: kcsa-comp-10
  type: mcq
  question: "Why must etcd snapshots be protected as carefully as etcd itself?"
  choices:
    - "They contain every object in the cluster, including Secrets, which are unencrypted unless encryption at rest is on"
    - "They contain the nodes' SSH keys"
    - "They can only be restored once"
    - "They store the container images"
  answer: A
  explanation: "A snapshot is a full copy of the cluster's state. Without encryption at rest, Secret values sit in it in plain form; with it, the snapshot is safe only as long as the encryption keys are stored elsewhere."

- id: kcsa-comp-11
  type: mcq
  question: "A new cluster has no NetworkPolicies. Which Pods can open connections to a database Pod?"
  choices:
    - "Only Pods in the same Namespace"
    - "Only Pods with the same labels"
    - "Every Pod in the cluster, in any Namespace"
    - "None, until a NetworkPolicy allows it"
  answer: C
  explanation: "The Kubernetes network model is flat: every Pod can reach every other Pod. Namespaces do not change that. Isolation starts only when a NetworkPolicy selects a Pod, and only if the CNI plugin enforces policies."

- id: kcsa-comp-12
  type: mcq
  question: "A user's kubeconfig with a client certificate has leaked. Why is this hard to contain?"
  choices:
    - "The certificate is also the cluster's CA"
    - "Kubernetes cannot revoke a single client certificate; it stays valid until it expires, so you must remove the RBAC bindings for that identity (or replace the CA)"
    - "Client certificates never expire"
    - "The kubeconfig contains the etcd password"
  answer: B
  explanation: "The API server trusts any unexpired certificate signed by its CA and has no revocation list. Remove every RoleBinding and ClusterRoleBinding for the user and its groups, keep certificates short-lived, and prefer OIDC or other tokens for people."

- id: kcsa-comp-13
  type: mcq
  question: "Which volume type lets a Pod read and write files on the node itself?"
  choices:
    - "emptyDir"
    - "configMap"
    - "projected"
    - "hostPath"
  answer: D
  explanation: "hostPath mounts a path of the node's file system into the container. A hostPath of / or of /etc gives a container the node. Pod Security baseline forbids hostPath; emptyDir, configMap, and projected volumes are managed by the kubelet and safe."

# --- Kubernetes Security Fundamentals (13) --------------------------------------

- id: kcsa-fund-01
  type: mcq
  question: "Which setting does Pod Security restricted require that baseline does not?"
  choices:
    - "No privileged containers"
    - "runAsNonRoot: true"
    - "No hostNetwork"
    - "No hostPath volumes"
  answer: B
  explanation: "baseline blocks known privilege escalations: privileged containers, host namespaces, hostPath, and more. restricted adds current hardening practice: non-root, seccomp RuntimeDefault or Localhost, no privilege escalation, and capabilities dropped to ALL."

- id: kcsa-fund-02
  type: mcq
  question: "You add the label pod-security.kubernetes.io/enforce=restricted to a Namespace whose Pods violate it. What happens to those running Pods?"
  choices:
    - "They keep running; only new Pods are checked"
    - "They are evicted at once"
    - "They are restarted with the missing settings added"
    - "The label is rejected while violating Pods exist"
  answer: A
  explanation: "Pod Security Admission is an admission controller: it checks requests to create Pods, not Pods that already run. The label command warns about violating Pods, and they are rejected the next time they are recreated, for example by a rollout."

- id: kcsa-fund-03
  type: mcq
  question: "What does the label pod-security.kubernetes.io/enforce-version=v1.37 on a Namespace do?"
  choices:
    - "It requires every Pod to run Kubernetes v1.37 images"
    - "It enforces only the checks introduced in v1.37"
    - "It pins the level's checks to those of release v1.37, so an upgrade does not change what is enforced"
    - "It marks the Namespace as deprecated after v1.37"
  answer: C
  explanation: "The Pod Security Standards are refined from release to release. Without a version the label means latest; pinning it keeps the checks stable across upgrades until you have tested the new ones."

- id: kcsa-fund-04
  type: mcq
  question: "How are human users represented in Kubernetes?"
  choices:
    - "As User objects stored in etcd"
    - "As ServiceAccounts in the kube-system Namespace"
    - "As entries in a users ConfigMap"
    - "They are not stored at all: the API server learns the user name and groups from the credential (certificate, token, or OIDC) on each request"
  answer: D
  explanation: "Kubernetes has no User object. Authenticators turn each request's credential into a user name and groups: the CN and O of a client certificate, the claims of an OIDC token, and so on. ServiceAccounts are the only identities Kubernetes stores itself, and they are meant for workloads."

- id: kcsa-fund-05
  type: mcq
  question: "What is true of the ServiceAccount tokens the kubelet mounts into Pods today?"
  choices:
    - "They never expire and are stored in a Secret"
    - "They are bound tokens with an expiry and an audience, refreshed by the kubelet, and invalid once the Pod is deleted"
    - "They contain the ServiceAccount's RBAC rules"
    - "They are shared by every Pod in the Namespace"
  answer: B
  explanation: "Since the TokenRequest API, Pods get projected, time-limited tokens bound to the Pod. Long-lived tokens in Secrets are no longer created automatically; they exist only if someone creates such a Secret on purpose."

- id: kcsa-fund-06
  type: mcq
  question: "A cluster runs with --authorization-mode=Node,RBAC. How is a request authorized?"
  choices:
    - "Both authorizers must allow it"
    - "Only the last authorizer in the list is used"
    - "The authorizers are asked in order; the first to allow or deny decides, and if none does, the request is denied"
    - "The Node authorizer applies to users, RBAC to ServiceAccounts"
  answer: C
  explanation: "Each authorizer can allow, deny, or have no opinion. The first decision wins; with no decision at all the request is forbidden. The Node authorizer only has opinions on kubelets' requests, so everyone else falls through to RBAC."

- id: kcsa-fund-07
  type: mcq
  question: "A Secret's data field holds cGFzc3dvcmQ=. What protection does that encoding give?"
  choices:
    - "None: it is base64, which anyone can decode"
    - "AES encryption with the cluster's key"
    - "A hash that cannot be reversed"
    - "Encryption with the ServiceAccount's key"
  answer: A
  explanation: "base64 only makes binary data safe to put in JSON and YAML. Protecting Secrets takes RBAC (who may read them), encryption at rest (how etcd stores them), and care with how Pods consume them."

- id: kcsa-fund-08
  type: mcq
  question: "Why is the RBAC verb list on Secrets as sensitive as get?"
  choices:
    - "list only returns the names of Secrets"
    - "list returns every Secret in the Namespace, values included"
    - "list is only allowed for cluster-admin"
    - "list triggers an audit alert"
  answer: B
  explanation: "A list response contains the full objects, data included. Granting list (or watch) on Secrets grants reading all of them; restrict both as carefully as get."

- id: kcsa-fund-09
  type: mcq
  question: "Which encryption-at-rest provider keeps the key-encryption key outside the control plane nodes?"
  choices:
    - "identity"
    - "aescbc"
    - "kms v2"
    - "secretbox"
  answer: C
  explanation: "aescbc, aesgcm, and secretbox keep their key in the EncryptionConfiguration file on the control plane node, so whoever reads that file can decrypt. kms v2 uses envelope encryption with a key held by an external key management service. identity does not encrypt."

- id: kcsa-fund-10
  type: mcq
  question: "Two teams share a cluster, each in its own Namespace. What does the Namespace boundary isolate by itself?"
  choices:
    - "Their network traffic"
    - "Their nodes and kernels"
    - "Their CPU and memory"
    - "Their object names, and the scope of RBAC Roles, quotas, and policies they can be given"
  answer: D
  explanation: "A Namespace is a naming and policy scope. Traffic needs NetworkPolicies, resources need ResourceQuotas and LimitRanges, and nodes and kernels need taints, affinity, or sandboxed runtimes to be separated."

- id: kcsa-fund-11
  type: mcq
  question: "Which audit level records who read a Secret, but not the Secret's value?"
  choices:
    - "Metadata"
    - "Request"
    - "RequestResponse"
    - "None"
  answer: A
  explanation: "Metadata records the user, verb, resource, name, source address, and result. Request and RequestResponse add the bodies, which for Secrets means their values; None records nothing."

- id: kcsa-fund-12
  type: mcq
  question: "A Namespace has a NetworkPolicy that denies all ingress, and another that allows ingress to app=api from app=web. Can app=web reach app=api?"
  choices:
    - "No: the deny policy wins"
    - "Only if the policies are merged into one"
    - "Yes: NetworkPolicies are additive, and any policy that allows a connection makes it allowed"
    - "Only if they run on the same node"
  answer: C
  explanation: "NetworkPolicies only allow; there is no deny rule. A Pod selected by any policy is isolated, and a connection is allowed if at least one policy allows it. That is how default-deny plus specific allows works."

- id: kcsa-fund-13
  type: mcq
  question: "You create NetworkPolicies in a cluster, and traffic is not affected at all. What is the most likely cause?"
  choices:
    - "NetworkPolicies take a day to apply"
    - "The CNI plugin does not enforce NetworkPolicies"
    - "The API server needs a restart"
    - "NetworkPolicies apply only to Services"
  answer: B
  explanation: "The API server stores NetworkPolicies, but the CNI plugin enforces them. Plugins such as Calico and Cilium do; a plugin that only provides connectivity accepts the objects and ignores them."

# --- Kubernetes Threat Model (10) ------------------------------------------------

- id: kcsa-threat-01
  type: mcq
  question: "Which data flow crosses from the control plane into a worker node when you run kubectl exec?"
  choices:
    - "etcd connects to the container directly"
    - "The scheduler opens a shell on the node"
    - "The API server connects to the kubelet on that node, which runs the command through the container runtime"
    - "kubectl connects to the container's IP address"
  answer: C
  explanation: "exec, logs, attach, and port-forward go from the client to the API server, and from the API server to the kubelet's port 10250. That is why the kubelet's API is a trust boundary worth hardening: whoever reaches it directly skips the API server's checks."

- id: kcsa-threat-02
  type: mcq
  question: "An attacker with root on a control plane node writes a Pod manifest into /etc/kubernetes/manifests. Why is that an effective persistence technique?"
  choices:
    - "The kubelet runs it as a static Pod; deleting its mirror Pod through the API does not stop it"
    - "The scheduler ignores the file"
    - "It disables audit logging"
    - "It encrypts etcd"
  answer: A
  explanation: "The kubelet starts every manifest in its static Pod directory and restarts it when it stops. The API only shows a read-only mirror Pod; the Pod disappears only when the file is removed from the node."

- id: kcsa-threat-03
  type: mcq
  question: "A Pod without memory limits leaks memory until its node runs out. Which controls prevent this kind of denial of service?"
  choices:
    - "Pod Security baseline"
    - "Memory limits on containers, enforced per Namespace with LimitRanges and ResourceQuotas"
    - "A NetworkPolicy"
    - "Encryption at rest"
  answer: B
  explanation: "A limit makes the kernel stop one container (OOM kill) before the node suffers. LimitRanges give containers defaults and maximums, and ResourceQuotas cap a Namespace's total, so one workload cannot starve the others."

- id: kcsa-threat-04
  type: mcq
  question: "Which API server feature keeps one noisy client from starving everyone else of API requests?"
  choices:
    - "Pod Security Admission"
    - "The Node authorizer"
    - "Encryption at rest"
    - "API Priority and Fairness"
  answer: D
  explanation: "API Priority and Fairness sorts requests into priority levels and queues them fairly between flows, so a misbehaving controller or client cannot crowd out the control plane's own requests."

- id: kcsa-threat-05
  type: mcq
  question: "A compromised image runs a crypto miner in a Pod. Which signals would reveal it?"
  choices:
    - "Unexpected processes and outbound connections reported by runtime monitoring such as Falco, and unusual CPU use in metrics"
    - "A failed liveness probe only"
    - "A change in the Pod's labels"
    - "An entry in the etcd snapshot"
  answer: A
  explanation: "Malicious code changes behavior: new processes, network connections to mining pools, and CPU usage far above normal. Runtime detection and metrics see this; admission control does not, because the image looked fine when it was admitted."

- id: kcsa-threat-06
  type: mcq
  question: "Pod-to-Pod traffic in the cluster is plain HTTP. Which threat does that expose it to?"
  choices:
    - "Privilege escalation through RBAC"
    - "Image tampering in the registry"
    - "An attacker on the network path (a compromised node or network device) reading or changing the traffic"
    - "Denial of service by the scheduler"
  answer: C
  explanation: "Unencrypted traffic can be sniffed and modified by anyone positioned on its path. mTLS, from a service mesh or a CNI plugin with encryption, protects it in transit and authenticates both ends."

- id: kcsa-threat-07
  type: mcq
  question: "An attacker gets a shell in a web Pod that never calls the Kubernetes API. Which setting would have left them without an API credential?"
  choices:
    - "runAsNonRoot: true"
    - "automountServiceAccountToken: false"
    - "A memory limit"
    - "imagePullPolicy: Always"
  answer: B
  explanation: "By default every Pod gets its ServiceAccount's token in /var/run/secrets/kubernetes.io/serviceaccount. A Pod that does not need the API should not have it: set automountServiceAccountToken: false on the Pod or its ServiceAccount."

- id: kcsa-threat-08
  type: mcq
  question: "Which RBAC permissions let a user grant themselves more permissions than they have?"
  choices:
    - "get and list on Pods"
    - "watch on Events"
    - "create on ConfigMaps"
    - "escalate or bind on Roles, and impersonate on users or groups"
  answer: D
  explanation: "RBAC normally prevents creating a binding to permissions you do not hold. escalate and bind lift that check; impersonate lets you act as another identity. All three amount to privilege escalation and belong only to administrators."

- id: kcsa-threat-09
  type: mcq
  question: "A user may only create Pods in the Namespace shop, and has no permissions on Secrets. Why can they still read shop's Secrets?"
  choices:
    - "They cannot"
    - "Creating Pods implies list on Secrets in RBAC"
    - "They can create a Pod that mounts any Secret of the Namespace, or runs as any of its ServiceAccounts, and read it from inside"
    - "Secrets are readable by every authenticated user"
  answer: C
  explanation: "A Pod can reference every Secret and ServiceAccount in its Namespace. Create on Pods is therefore as sensitive as reading those Secrets and using those identities; admission policies can narrow what such Pods may reference."

- id: kcsa-threat-10
  type: mcq
  question: "What does allowPrivilegeEscalation: false prevent?"
  choices:
    - "A process gaining more privileges than its parent, for example through setuid binaries"
    - "The container running as root"
    - "The Pod using a ServiceAccount"
    - "The container reaching the network"
  answer: A
  explanation: "It sets the no_new_privs flag on the container's processes, so setuid and setgid binaries and file capabilities cannot raise privileges. It does not change the user the container starts as; that is runAsUser and runAsNonRoot."

# --- Platform Security (10) --------------------------------------------------------

- id: kcsa-plat-01
  type: mcq
  question: "What is a Software Bill of Materials (SBOM) used for?"
  choices:
    - "Signing an image"
    - "Listing the components and versions in an artifact, so that you can find which images contain a newly published vulnerability"
    - "Encrypting an image in the registry"
    - "Replacing vulnerability scanning"
  answer: B
  explanation: "An SBOM (in SPDX or CycloneDX format) inventories what an image is made of. When a vulnerability is announced, SBOMs tell you at once which of your artifacts contain the affected component. It complements scanning, it does not replace it."

- id: kcsa-plat-02
  type: mcq
  question: "How do you make sure the cluster only runs images that your CI pipeline built?"
  choices:
    - "Use only images with the tag stable"
    - "Pull images with imagePullPolicy: Always"
    - "Sign images in the pipeline (for example with Sigstore cosign) and verify the signatures in an admission controller"
    - "Store images in etcd"
  answer: C
  explanation: "A signature ties an image digest to the identity that signed it. A policy engine (Kyverno, Gatekeeper with a provider, or Sigstore's policy-controller) rejects Pods whose images lack a valid signature from your pipeline."

- id: kcsa-plat-03
  type: mcq
  question: "How do you keep workloads from pulling images from arbitrary public registries?"
  choices:
    - "Delete the default ServiceAccount"
    - "Disable DNS in the cluster"
    - "Use only private Namespaces"
    - "An admission policy that allows only images from approved registries, ideally a private registry that mirrors and scans what you use"
  answer: D
  explanation: "An admission rule (a ValidatingAdmissionPolicy, Kyverno, or Gatekeeper) checks every image reference against an allow list. A private registry adds access control, scanning, and protection from upstream images changing or disappearing."

- id: kcsa-plat-04
  type: mcq
  question: "Someone deleted a Deployment in production. Which record tells you who did it and when?"
  choices:
    - "The Kubernetes audit log"
    - "The Deployment's events"
    - "The kubelet's logs"
    - "The container's logs"
  answer: A
  explanation: "Only the API server sees every request with its authenticated user, and its audit log records it. Events are short-lived and do not name users; the kubelet and the containers never see API requests."

- id: kcsa-plat-05
  type: mcq
  question: "What security property does a service mesh's mTLS add to service-to-service traffic?"
  choices:
    - "It replaces RBAC for the Kubernetes API"
    - "Encryption in transit, and a cryptographic identity for each workload that authorization policies can use"
    - "It scans images for vulnerabilities"
    - "It enforces Pod Security Standards"
  answer: B
  explanation: "The mesh's proxies encrypt traffic and present certificates that identify the workload (often as a SPIFFE ID based on its ServiceAccount). Policies can then allow calls by service identity instead of by IP address."

- id: kcsa-plat-06
  type: mcq
  question: "In a kubeadm cluster, how long are the CA certificate and the component certificates (such as the API server's) valid by default?"
  choices:
    - "Both one year"
    - "Both ten years"
    - "The CA ten years, the component certificates one year"
    - "They never expire"
  answer: C
  explanation: "kubeadm creates CAs valid for ten years and leaf certificates valid for one year. kubeadm upgrades renew the leaf certificates; otherwise kubeadm certs renew does, before they expire and break the control plane."

- id: kcsa-plat-07
  type: mcq
  question: "Why does kubeadm give etcd a CA of its own, separate from the cluster CA?"
  choices:
    - "etcd cannot read the cluster CA's format"
    - "To make etcd faster"
    - "Because etcd runs outside the cluster"
    - "So that certificates signed by the cluster CA, such as users' client certificates, cannot authenticate to etcd"
  answer: D
  explanation: "etcd trusts any certificate its CA signed. With a separate etcd CA, only the certificates made for etcd and the API server's etcd client certificate are accepted; a user's cluster certificate gets no access to the data store."

- id: kcsa-plat-08
  type: mcq
  question: "Which object restricts which destinations Pods may connect to outside the cluster?"
  choices:
    - "A NetworkPolicy with egress rules"
    - "An Ingress"
    - "A Service of type LoadBalancer"
    - "A ResourceQuota"
  answer: A
  explanation: "Egress rules in a NetworkPolicy limit outgoing connections, including to IP blocks outside the cluster. Ingress objects and Services expose workloads; they do not limit what Pods connect to."

- id: kcsa-plat-09
  type: mcq
  question: "In which order does the API server run admission for a create request?"
  choices:
    - "Validating admission, then mutating admission, then authentication"
    - "Mutating admission, then schema validation, then validating admission, then storage in etcd"
    - "Storage first, then admission in the background"
    - "Only one admission controller runs per request"
  answer: B
  explanation: "After authentication and authorization, mutating admission may change the object, the object is validated against its schema, and validating admission (including ValidatingAdmissionPolicies and webhooks) accepts or rejects the final version before it is stored."

- id: kcsa-plat-10
  type: mcq
  question: "A validating admission webhook that enforces security rules has failurePolicy: Ignore. What happens when the webhook is down?"
  choices:
    - "All requests are rejected"
    - "The API server restarts"
    - "Requests are admitted without the webhook's checks, so its rules are silently not enforced"
    - "The webhook's last decision is reused"
  answer: C
  explanation: "Ignore fails open: availability wins over enforcement. Fail rejects matching requests while the webhook is unreachable, which keeps the rules but can block the cluster. Security webhooks usually use Fail, with care for the namespaces the webhook itself runs in."

# --- Compliance and Security Frameworks (6) -----------------------------------------

- id: kcsa-compl-01
  type: mcq
  question: "What does kube-bench do?"
  choices:
    - "It load-tests the API server"
    - "It scans container images for vulnerabilities"
    - "It enforces Pod Security Standards"
    - "It checks a cluster's nodes and components against the CIS Kubernetes Benchmark and reports PASS, FAIL, and WARN"
  answer: D
  explanation: "The CIS Kubernetes Benchmark lists configuration recommendations for the control plane, etcd, and the nodes. kube-bench automates the checks it can, so audits are repeatable; fixing the findings stays your job."

- id: kcsa-compl-02
  type: mcq
  question: "In the STRIDE threat model, which category covers an attacker who can deny having deleted a Deployment because no record of it exists?"
  choices:
    - "Repudiation"
    - "Spoofing"
    - "Tampering"
    - "Elevation of privilege"
  answer: A
  explanation: "STRIDE stands for Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation of privilege. Repudiation threats are countered by trustworthy records, in Kubernetes the audit log."

- id: kcsa-compl-03
  type: mcq
  question: "What is MITRE ATT&CK?"
  choices:
    - "A compliance standard for payment data"
    - "A public knowledge base of attackers' tactics and techniques, with a matrix for containers and Kubernetes"
    - "A vulnerability scanner"
    - "A CNCF admission controller"
  answer: B
  explanation: "ATT&CK organizes real attacker behavior into tactics (goals such as persistence or credential access) and techniques. Teams use it to plan detections and to describe incidents in a common language."

- id: kcsa-compl-04
  type: mcq
  question: "A cluster processes credit card payments. Which compliance standard applies to it?"
  choices:
    - "HIPAA"
    - "SOC 2 only"
    - "PCI DSS"
    - "FedRAMP"
  answer: C
  explanation: "PCI DSS governs systems that store, process, or transmit cardholder data: network segmentation, access control, encryption, and logging. HIPAA covers health data in the US, FedRAMP US government cloud services, and SOC 2 is a general audit of controls."

- id: kcsa-compl-05
  type: mcq
  question: "What does the SLSA framework describe?"
  choices:
    - "Service level agreements for managed Kubernetes"
    - "A file format for SBOMs"
    - "An image signing tool"
    - "Levels of supply chain integrity for build systems, such as producing signed provenance for each artifact"
  answer: D
  explanation: "SLSA (Supply-chain Levels for Software Artifacts) defines increasing levels of assurance about how an artifact was built: from documented builds to hardened, isolated builders that produce verifiable provenance."

- id: kcsa-compl-06
  type: mcq
  question: "Why do platform teams use policy as code (for example Kyverno or OPA Gatekeeper) for compliance?"
  choices:
    - "Policies are versioned, reviewed, and enforced automatically at admission, and audits can report existing violations continuously"
    - "It removes the need for RBAC"
    - "It encrypts the cluster's data"
    - "It replaces the CIS Benchmark"
  answer: A
  explanation: "Written as code, compliance rules go through the same review and testing as other changes, are enforced on every request, and produce reports of resources that violate them. Manual checklists drift; enforced policies do not."
