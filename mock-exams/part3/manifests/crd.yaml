# Question 12: the custom resource the reader creates an object of.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.ops.kbook.io
spec:
  group: ops.kbook.io
  scope: Namespaced
  names:
    plural: backups
    singular: backup
    kind: Backup
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [schedule, retain]
              properties:
                schedule:
                  type: string
                retain:
                  type: integer
                  minimum: 1
