# Namespace p1-callisto: the shared Pods for questions 7, 8, and 9.
# Helper workloads stay small so many labs can share one cluster.
apiVersion: v1
kind: Pod
metadata:
  name: c-web-1
  labels: {tier: web, env: prod, stage: beta}
spec:
  containers:
    - name: web
      image: nginx:1.27
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-web-2
  labels: {tier: web, env: dev, stage: ga, temp: "yes"}
spec:
  containers:
    - name: web
      image: nginx:1.26
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-db-1
  labels: {tier: db, env: prod, stage: beta}
spec:
  containers:
    - name: db
      image: nginx:1.26
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
    - name: backup
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-db-2
  labels: {tier: db, env: dev, stage: alpha}
spec:
  containers:
    - name: db
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-cache-1
  labels: {tier: cache, env: prod, temp: "yes"}
spec:
  containers:
    - name: cache
      image: nginx:1.27
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
    - name: warmer
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-cache-2
  labels: {tier: cache, env: dev, stage: alpha}
spec:
  containers:
    - name: cache
      image: nginx:1.26
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-batch-1
  labels: {tier: batch, stage: beta}
spec:
  containers:
    - name: batch
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: c-misc
  labels: {env: prod}
spec:
  containers:
    - name: misc
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
