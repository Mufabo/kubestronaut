# Namespace p1-ganymede: Deployments for questions 17 and 18.
# Helper workloads stay small so many labs can share one cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit
  labels: {app: orbit}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orbit}
  template:
    metadata:
      labels: {app: orbit}
    spec:
      containers:
        - name: web
          image: nginx:1.26
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone
  labels: {app: drone}
spec:
  replicas: 3
  selector:
    matchLabels: {app: drone}
  template:
    metadata:
      labels: {app: drone}
    spec:
      terminationGracePeriodSeconds: 1   # busybox sleep ignores SIGTERM
      containers:
        - name: drone
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
