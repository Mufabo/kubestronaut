# Namespace p1-titan, question 4. The agent container prints the token on its
# first run only, then exits; after the kubelet restarts it, it stays quiet.
# The emptyDir survives container restarts, so the second run knows.
apiVersion: v1
kind: Pod
metadata:
  name: beacon
  labels: {app: beacon}
spec:
  volumes:
    - name: work
      emptyDir: {}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
    - name: agent
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ -f /work/ran ]; then
            echo "agent restarted, nothing to report"
            exec sleep 3600
          fi
          touch /work/ran
          echo "connecting to control service"
          echo "token=__TOKEN__"
          echo "lost connection, exiting"
          exit 1
      volumeMounts:
        - name: work
          mountPath: /work
      resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
