# Question 5: a Deployment on node2, without an AppArmor profile of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      nodeSelector:
        kubernetes.io/hostname: node2
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
