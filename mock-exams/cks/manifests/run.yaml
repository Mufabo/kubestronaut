# Question 15: an Apache web server with a writable root file system.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
